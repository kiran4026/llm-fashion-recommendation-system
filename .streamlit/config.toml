[theme]
primaryColor = "#e6a23c"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f29"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
